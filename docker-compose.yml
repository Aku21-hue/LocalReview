version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hmdp
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/hmdp.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: hmdp-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hmdp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
